name: elyeter
description: "Elyeter e-commerce app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---------------------------------------------------------------- state --
  # BLoC for feature state; equatable for value-equality in states/events;
  # hydrated_bloc persists theme + locale across launches.
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  hydrated_bloc: ^11.0.0

  # ------------------------------------------------- dependency injection --
  get_it: ^9.2.1

  # ------------------------------------------------------------ navigation --
  go_router: ^17.5.0

  # --------------------------------------------------------------- network --
  dio: ^5.11.1
  connectivity_plus: ^7.3.1

  # --------------------------------------------------------------- storage --
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6

  # ---------------------------------------------------------- localization --
  intl: ^0.20.2

  # -------------------------------------------------------------------- ui --
  cupertino_icons: ^1.0.8
  hugeicons: ^1.1.7
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0
  glassmorphism: ^4.0.0

  # ---------------------------------------------------------------- media --
  # Pure-Dart JPEG resize/re-encode — shrinks a picked avatar below the
  # upload limit without pulling in a native codec.
  image: ^4.5.4

  # Visual search: `camera` drives the in-app capture screen, `image_picker`
  # is only used for the "pick from gallery" shortcut on that screen.
  camera: ^0.12.0+2
  image_picker: ^1.2.3

  # -------------------------------------------------------------- firebase --
  # Push. `lib/firebase_options.dart` is generated by `flutterfire configure`
  # and is what [PushService] initializes with.
  #
  # `flutter_local_notifications` is not optional here: a push arriving while
  # the app is **open** fires `onMessage` but draws nothing on Android, so
  # that banner has to be raised by hand.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

  # ------------------------------------------------------------- utilities --
  logger: ^2.8.0

  # Opens the support line, the socials and WhatsApp in the
  # platform's own apps.
  url_launcher: ^6.3.2

  # System share sheet for the product share button.
  share_plus: ^13.3.0
  flutter_html: ^3.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  location: ^10.0.2
  geocoding: ^5.0.0
  html: 0.15.6
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ------------------------------------------------------------------ lint --
  flutter_lints: ^6.0.0

  # ------------------------------------------------------------------ test --
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # Generates lib/l10n/app_localizations.dart from lib/l10n/arb/*.arb
  # (config lives in l10n.yaml at the project root).
  generate: true

  assets:
    - assets/images/
    - assets/images/flags/
    - assets/images/magazynes/
    - assets/images/category/
    - assets/images/banners/
    - assets/images/logos/
    - assets/images/products/
    - assets/images/subcategory/
    - assets/icons/

  fonts:
    # Display face used for the brand wordmark only (shimmer placeholders).
    - family: Qurova
      fonts:
        - asset: assets/fonts/QurovaDEMO-Medium.otf
          weight: 500

    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-Light.ttf
          weight: 300
        - asset: assets/fonts/InterDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/InterDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
